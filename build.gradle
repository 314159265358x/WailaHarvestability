buildscript {
	repositories {
		mavenCentral()
		maven {
			name = "forge"
			url = 'https://maven.minecraftforge.net/'
		}
	}
	dependencies {
		classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
	}
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version='1.1.13'
group='squeek.wailaharvestability'
//archivesBaseName ='WailaHarvestability'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
	//version = "14.23.5.2847"
	version = "1.12-14.21.1.2443"
	mappings = "snapshot_20170624"
	//mappings = "snapshot_20170615"
	//mappings channel: 'stable', version: '39-1.12'
	//mappings channel: 'snapshot', version: '20170624-1.12'
	//runDir = "run"

	//replace "\${version}", project.version
	//replaceIn "src/main/java/squeek/wailaharvestability/ModInfo.java"
}

repositories {  
mavenCentral()
mavenLocal()
jcenter()
//	maven {url "http://tehnut.info/maven"}
}

dependencies {
//minecraft 'net.minecraftforge:forge:1.12.2-14.21.1.2443'
//deobfCompile "mcp.mobius.waila:Hwyla:1.8.18-B32_1.12"
	compileOnly files( "libs/Hwyla-1.8.26-B42_1.12.2-deobf.jar" )
}

//group = project.projectDir.name.toLowerCase()
archivesBaseName = "WailaHarvestability-mc1.12.2"// + project.minecraft.version

task deobfJar(type: Jar) {
	from sourceSets.main.output
	classifier = 'deobf'
}
/*
task sourceJar(type: Jar, dependsOn: classes) {
  classifier = "sources"
  from sourceSets.main.allSource
}
*/
/*
sourceSets.main{
	java {
		srcDirs 'java', 'apis'
	}
	resources {
		srcDirs 'resources'
	}
}
*/
processResources
{
	inputs.property "vars", project.version + "1.12.2"//project.minecraft.version
	from(sourceSets.main.resources.srcDirs) {
		include '**/*.info'
		expand 'version':project.version, 'mcversion':"1.12.2"//project.minecraft.version
	}
	from(sourceSets.main.resources.srcDirs) {
		exclude '**/*.info'
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifacts {
	            archives jar
			    archives sourceJar
				archives deobfJar
			}
		}
	}
	repositories {
		maven {
			url "file:///${project.projectDir}/mcmodsrepo"
		}
	}
}

